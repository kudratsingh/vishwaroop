# Optional local hooks; CI is the authority. Install with: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format --check
        entry: python -m ruff format --check src tests
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check src tests
        language: system
        pass_filenames: false
      - id: scan-secrets
        name: secrets and absolute-path scan
        entry: ironclad-scan-secrets
        language: system
        pass_filenames: false
      - id: ironclad-verify
        name: policy copies, pin and contract
        entry: ironclad verify --root .
        language: system
        pass_filenames: false
